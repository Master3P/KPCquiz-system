<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบแบบทดสอบออนไลน์</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    :root { --main: #1a237e; --secondary: #303f9f; --accent: #00e676; --danger: #e74c3c; --bg: #f5f6fa; --card: #ffffff; --text: #2c3e50; }
    body { font-family: 'Prompt', sans-serif; background: var(--bg); margin: 0; color: var(--text); overflow-x: hidden; }
    .hidden { display: none !important; }
    #loginGateView { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--main), var(--secondary)); padding: 20px; box-sizing: border-box; }
    .logo-container { text-align: center; color: white; margin-bottom: 40px; } .logo-container i { font-size: 60px; margin-bottom: 10px; }
    .gate-card { background: var(--card); width: 100%; max-width: 350px; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; margin-bottom: 20px; cursor: pointer; transition: 0.3s; }
    header { background: var(--main); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
    .container { padding: 20px; max-width: 800px; margin: 0 auto; box-sizing: border-box; }
    .m-card { background: var(--card); border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
    button { padding: 12px; border-radius: 10px; border: none; font-weight: 600; font-family: 'Prompt'; font-size: 15px; cursor: pointer; width: 100%; margin-bottom: 10px; }
    .btn-main { background: var(--main); color: white; } .btn-outline { background: white; border: 2px solid var(--main); color: var(--main); }
    input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 15px; box-sizing: border-box; font-family: 'Prompt'; }
    .list-item { background: #fff; padding: 15px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .timer-bar { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-bottom: 20px; } #timerFill { height: 100%; background: #e74c3c; width: 100%; transition: 1s linear; }
    .opt-btn { background: white; border: 2px solid #eee; text-align: left; padding: 15px; border-radius: 12px; margin-bottom: 10px; width: 100%; } .opt-btn.selected { background: #e8f0fe; border-color: var(--main); font-weight: 600; }
    #overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index:5000; display:flex; flex-direction:column; justify-content:center; align-items:center; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--main); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; } @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="overlay" class="hidden"><div class="loader"></div><p style="margin-top:15px; font-weight:600;">กำลังดำเนินการ...</p></div>

  <div id="loginGateView">
    <div class="logo-container"><i class="fas fa-shield-alt"></i><h1>แบบทดสอบออนไลน์</h1></div>
    <div class="gate-card" onclick="selectRole('student')"><i class="fas fa-user-graduate"></i><h3>เข้าใช้งานสำหรับนักศึกษา</h3></div>
    <div class="gate-card" onclick="showPinModal()"><i class="fas fa-user-tie"></i><h3>จัดการระบบสำหรับอาจารย์</h3></div>
  </div>

  <div id="pinModal" class="pin-modal hidden">
    <div class="pin-box">
      <input type="password" id="adminPinInput" placeholder="PIN 4 หลัก" maxlength="4" style="text-align:center;">
      <button class="btn-main" onclick="verifyAdmin()">ตกลง</button>
      <button class="btn-outline" onclick="closePinModal()">ยกเลิก</button>
    </div>
  </div>

  <header id="mainHeader" class="hidden">
    <button onclick="goHome()" style="background:none; border:none; color:white;"><i class="fas fa-home"></i></button><h2>แบบทดสอบออนไลน์</h2><button onclick="logout()" style="background:none; border:none; color:white;"><i class="fas fa-sign-out-alt"></i></button>
  </header>

  <div class="container hidden" id="appContainer">
    <div id="adminDashboardView" class="hidden"><button class="btn-main" onclick="showView('adminCreateView')">+ เพิ่มแบบทดสอบใหม่</button><div id="sessionList"></div></div>
    <div id="adminCreateView" class="hidden"><div class="m-card"><h4>ชื่อแบบทดสอบ</h4><input type="text" id="newSessionName"><button class="btn-main" onclick="createSession()">ยืนยันสร้าง</button></div></div>

    <div id="adminManageView" class="hidden">
      <h3 id="manageSessionTitle" style="text-align:center;"></h3>
      <div class="m-card">
        <button id="btnStatWAITING" class="btn-outline" onclick="changeStatus('WAITING')">ห้องรอ</button>
        <button id="btnStatSTART" class="btn-outline" onclick="changeStatus('START')">เริ่มสอบ</button>
        <button id="btnStatEND" class="btn-outline" onclick="changeStatus('END')">ปิดระบบ</button>
      </div>

      <div class="m-card" style="background: #fdf2ff;">
        <h4>AI Gemini สร้างข้อสอบ</h4>
        <input type="text" id="aiTopic" placeholder="ระบุหัวข้อ">
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
          <input type="number" id="aiNumQ" placeholder="กี่ข้อ" value="5">
          <input type="number" id="aiMin" placeholder="นาที" value="0">
          <input type="number" id="aiSec" placeholder="วินาที" value="30">
        </div>
        <button class="btn-main" onclick="runAI()">สั่ง AI สร้าง</button>
      </div>

      <div class="m-card">
        <h4 id="qFormTitle">เพิ่มข้อสอบด้วยตัวเอง</h4>
        <input type="hidden" id="editRowIndex"><input type="text" id="qText" placeholder="โจทย์">
        <div id="dynamicOptionsContainer"></div>
        <button class="btn-outline" style="font-size:12px;" onclick="addOptionField()">+ เพิ่มตัวเลือก</button>
        <select id="qAns"><option value="">-- เฉลยลำดับที่ --</option></select>
        <div style="display:flex; gap:10px;">
          <input type="number" id="qMin" placeholder="นาที" value="0">
          <input type="number" id="qSec" placeholder="วินาที" value="30">
        </div>
        <button class="btn-main" onclick="handleQuestionSubmit()">บันทึกข้อสอบ</button>
      </div>
      <div id="existingQuestionsList"></div>
    </div>

    <div id="studentDashboardView" class="hidden">
      <button class="btn-main" onclick="showView('studentLoginView'); loadActiveSessions();">เข้าสอบ</button>
    </div>

    <div id="studentLoginView" class="hidden">
      <div class="m-card">
        <select id="studentSessionSelect"></select>
        <input type="text" id="studentId" placeholder="รหัสนักศึกษา">
        <input type="text" id="studentName" placeholder="ชื่อ-นามสกุล">
        <button class="btn-main" onclick="studentJoinQuiz()">ตกลง</button>
      </div>
    </div>

    <div id="quizView" class="hidden">
      <div id="timer" style="font-size:30px; text-align:center; color:red;">--</div>
      <div class="timer-bar"><div id="timerFill"></div></div>
      <div class="m-card"><h3 id="questionText"></h3><div id="optionsContainer"></div></div>
      <button id="confirmBtn" class="btn-main hidden" onclick="confirmMyAnswer()">ยืนยันคำตอบ</button>
    </div>

    <div id="resultView" class="hidden" style="text-align:center;">
      <div class="m-card"><h1>คะแนนของคุณ</h1><h1 id="finalScoreDisplay" style="font-size:70px;">--/--</h1><button class="btn-main" onclick="goHome()">กลับหน้าหลัก</button></div>
    </div>
  </div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxSOY5kpKjp4l1sf_jzVx4-3ce3-oZis2rZT7Ihh4_EBlimfXY5rypy0HFLe7OzqIZeQA/exec"; 
  let currentSessionID = "", myStudentID = "", currentQNum = 1, timerInterval, userSelectedChoice = 0, isEditing = false, cachedQuestions = [], totalQuizQuestions = 0;

  async function apiCall(action, payload = {}) {
    try {
      const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: action, ...payload }) });
      const json = await res.json();
      if (json.status === "error") throw new Error(json.message);
      return json.data;
    } catch (e) { alert(e.message); document.getElementById('overlay').classList.add('hidden'); throw e; }
  }

  function showView(v) { document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden')); document.getElementById(v).classList.remove('hidden'); }
  function goHome() { location.reload(); }
  function selectRole(role) { if(role === 'student') { document.getElementById('loginGateView').classList.add('hidden'); document.getElementById('mainHeader').classList.remove('hidden'); document.getElementById('appContainer').classList.remove('hidden'); showView('studentDashboardView'); } }
  function showPinModal() { document.getElementById('pinModal').classList.remove('hidden'); }
  function closePinModal() { document.getElementById('pinModal').classList.add('hidden'); }
  function verifyAdmin() { if(document.getElementById('adminPinInput').value === "1234") { closePinModal(); document.getElementById('loginGateView').classList.add('hidden'); document.getElementById('mainHeader').classList.remove('hidden'); document.getElementById('appContainer').classList.remove('hidden'); showView('adminDashboardView'); loadDashboardStats(); } else alert("ผิด"); }

  async function loadDashboardStats() { let s = await apiCall("getDashboardStats"); loadAdminList(); }
  async function loadAdminList() { let ss = await apiCall("getSessions"); let h = ""; ss.forEach(s => { h += `<div class="list-item"><span><b>${s.name}</b></span><button class="btn-outline" style="width:auto;" onclick="manageSession('${s.id}','${s.name}','${s.status}')">จัดการ</button></div>`; }); document.getElementById('sessionList').innerHTML = h; }
  async function createSession() { let n = document.getElementById('newSessionName').value; let id = await apiCall("createNewSession", {name: n}); manageSession(id,n,"WAITING"); }
  function manageSession(id, name, status) { currentSessionID = id; document.getElementById('manageSessionTitle').innerText = name; showView('adminManageView'); loadQuestions(); resetQForm(); updateStatusUI(status); }
  function updateStatusUI(st) { document.querySelectorAll('[id^="btnStat"]').forEach(btn => btn.style.background = "white"); document.getElementById('btnStat'+st).style.background = "var(--main)"; document.getElementById('btnStat'+st).style.color = "white"; }
  async function changeStatus(s) { await apiCall("updateSessionStatus", {sessionID: currentSessionID, status: s}); updateStatusUI(s); }

  async function runAI() { 
    document.getElementById('overlay').classList.remove('hidden'); 
    let total = (parseInt(document.getElementById('aiMin').value) * 60) + parseInt(document.getElementById('aiSec').value);
    let res = await apiCall("generateQuestionsWithAI", {sessionID: currentSessionID, topic: document.getElementById('aiTopic').value, numQ: document.getElementById('aiNumQ').value, numOpt: 4, totalSeconds: total}); 
    document.getElementById('overlay').classList.add('hidden'); 
    if(res === "SUCCESS") { loadQuestions(); alert("สำเร็จ"); } else alert(res);
  }

  async function loadQuestions() { 
    cachedQuestions = await apiCall("getQuestionsAdmin", {sessionID: currentSessionID}); 
    let h = ""; 
    cachedQuestions.forEach(q => {
      let timeText = Math.floor(q.time/60) + "น. " + (q.time%60) + "ว.";
      h += `<div class="list-item"><span style="font-size:13px;"><b>${q.qNum}. ${q.question}</b><br><small style="color:green;">เฉลยข้อ: ${q.ans} | เวลา: ${timeText}</small></span><button onclick="delQ(${q.rowIndex})" style="width:auto; color:red; background:none;">ลบ</button></div>`;
    }); 
    document.getElementById('existingQuestionsList').innerHTML = h; 
  }

  function addOptionField(v="") { let c = document.getElementById("dynamicOptionsContainer"); let d = document.createElement("div"); d.style="display:flex; gap:5px;"; d.innerHTML = `<input type="text" class="qOptInput" value="${v}"><button type="button" onclick="this.parentElement.remove(); updateAnswerDropdown();">X</button>`; c.appendChild(d); updateAnswerDropdown(); }
  function updateAnswerDropdown() { let s = document.getElementById("qAns"), count = document.querySelectorAll(".qOptInput").length; s.innerHTML = '<option value="">-- เฉลยลำดับที่ --</option>'; for(let i=1; i<=count; i++) s.innerHTML += `<option value="${i}">${i}</option>`; }
  function resetQForm() { document.getElementById('qText').value = ""; document.getElementById("dynamicOptionsContainer").innerHTML = ""; [1,2,3,4].forEach(() => addOptionField()); }

  async function handleQuestionSubmit() { 
    document.getElementById('overlay').classList.remove('hidden'); 
    let os = []; document.querySelectorAll('.qOptInput').forEach(i => os.push(i.value)); 
    let total = (parseInt(document.getElementById('qMin').value) * 60) + parseInt(document.getElementById('qSec').value);
    let d = { question: document.getElementById('qText').value, options: os, ans: document.getElementById('qAns').value, time: total }; 
    await apiCall("addQuestionToSession", {sessionID: currentSessionID, qData: d}); 
    document.getElementById('overlay').classList.add('hidden'); loadQuestions(); resetQForm(); 
  }

  async function delQ(r) { if(confirm("ลบ?")) { await apiCall("deleteQuestion", {rowIndex: r}); loadQuestions(); } }

  // ---------------- STUDENT ----------------
  async function loadActiveSessions() { let ss = await apiCall("getSessions"); let s = document.getElementById('studentSessionSelect'); s.innerHTML = '<option value="">-- เลือกวิชา --</option>'; ss.forEach(v => { if(v.status !== 'END') s.innerHTML += `<option value="${v.id}">${v.name}</option>`; }); }
  async function studentJoinQuiz() { currentSessionID = document.getElementById('studentSessionSelect').value; myStudentID = document.getElementById('studentId').value; if(!currentSessionID || !myStudentID) return; document.getElementById('overlay').classList.remove('hidden'); let res = await apiCall("studentJoin", {sessionID: currentSessionID, studentID: myStudentID, studentName: document.getElementById('studentName').value}); document.getElementById('overlay').classList.add('hidden'); if(res !== true) { alert(res); return; } showView('quizView'); let poll = setInterval(async () => { let st = await apiCall("checkSessionStatus", {sessionID: currentSessionID}); if(st === "START") { clearInterval(poll); loadNext(); } }, 4000); }
  async function loadNext() { userSelectedChoice = 0; document.getElementById("optionsContainer").innerHTML = ""; document.getElementById("confirmBtn").classList.add("hidden"); let d = await apiCall("getQuestionForStudent", {sessionID: currentSessionID, qNum: currentQNum}); renderQ(d); }
  async function renderQ(d) { if(!d) { showView('resultView'); document.getElementById('overlay').classList.remove('hidden'); let score = await apiCall("getFinalScore", {sessionID: currentSessionID, studentID: myStudentID}); document.getElementById("finalScoreDisplay").innerText = score + "/" + totalQuizQuestions; document.getElementById('overlay').classList.add('hidden'); return; } totalQuizQuestions = d.total; document.getElementById("questionText").innerText = d.question; d.options.forEach((o, i) => { let b = document.createElement("button"); b.className = "opt-btn"; b.innerText = o; b.onclick = () => { userSelectedChoice = i+1; document.querySelectorAll(".opt-btn").forEach(btn => btn.classList.remove("selected")); b.classList.add("selected"); document.getElementById("confirmBtn").classList.remove("hidden"); }; document.getElementById("optionsContainer").appendChild(b); }); startTimer(d.timeLimit); }
  function startTimer(s) { clearInterval(timerInterval); let limit = s; timerInterval = setInterval(() => { s--; document.getElementById("timer").innerText = s; document.getElementById("timerFill").style.width = (s/limit*100) + "%"; if(s <= 0) { clearInterval(timerInterval); submitAnswer(0); } }, 1000); }
  function confirmMyAnswer() { if(userSelectedChoice) { document.getElementById("confirmBtn").classList.add("hidden"); submitAnswer(userSelectedChoice); } }
  async function submitAnswer(c) { clearInterval(timerInterval); document.getElementById('overlay').classList.remove('hidden'); await apiCall("submitStudentAnswer", {sessionID: currentSessionID, studentID: myStudentID, qNum: currentQNum, choice: c}); document.getElementById('overlay').classList.add('hidden'); currentQNum++; loadNext(); }
</script>
</body>
</html>
